global:
  scrape_interval: 15s

scrape_configs:
  # dns_sd : découvre automatiquement toutes les réplicas de l'API
  - job_name: api
    metrics_path: /metrics/
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
  - job_name: api_canary
    metrics_path: /metrics/
    dns_sd_configs:
      - names: [api_canary]
        type: A
        port: 8000
  - job_name: drift
    static_configs:
      - targets: ["drift:9100"]
